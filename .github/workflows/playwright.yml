name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      demo_failure:
        description: 'Run the intentional demo failure to see screenshots, video and trace'
        type: boolean
        default: false

jobs:
  test:
    name: e2e (${{ matrix.project }})${{ inputs.demo_failure && ' [demo failure]' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]
    env:
      DEMO_FAILURE: ${{ inputs.demo_failure && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --pass-with-no-tests

      # HTML report: always uploaded. Failed tests inside it carry their
      # screenshot, video and trace, viewable right in the report.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      # Raw failure evidence (PNG screenshots, WebM videos, trace.zip) and JUnit XML.
      - name: Upload failure screenshots, videos and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-${{ matrix.project }}
          path: test-results/
          retention-days: 14

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Playwright results (${{ matrix.project }})"
            if [ -f test-results/junit.xml ]; then
              node -e "const x=require('fs').readFileSync('test-results/junit.xml','utf8');const m=x.match(/<testsuites[^>]*>/)[0];const g=k=>(m.match(new RegExp(k+'=\"(\\\\d+)\"'))||[])[1]||0;console.log('| Total | Failed | Skipped |\n|---|---|---|\n| '+g('tests')+' | '+g('failures')+' | '+g('skipped')+' |')"
            fi
            echo ""
            echo "Download **playwright-report-${{ matrix.project }}** from the Artifacts section below, unzip it, and run \`npx playwright show-report <folder>\`."
          } >> "$GITHUB_STEP_SUMMARY"
